name: Scheduled Attendance Push Reminders

on:
  schedule:
    # Run hourly on weekdays (02:30 to 14:30 UTC = 08:00 AM to 08:00 PM IST)
    # Covers custom per-user prompt hours (9 AM, 10 AM, 12 PM, etc.) and +3h reminder offsets
    - cron: '30 2-14 * * 1-5'
  workflow_dispatch:
    inputs:
      action:
        description: 'Push action to trigger'
        required: true
        default: 'cron_attendance'
        type: choice
        options:
          - cron_attendance
          - send_attendance
          - send_reminder
          - test

jobs:
  dispatch-push:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Web Push Edge Function
        run: |
          ACTION="${{ github.event.inputs.action || 'cron_attendance' }}"
          echo "Triggering action: $ACTION"
          curl -s -X POST https://vyuiuhlzxjeqwzhwocbg.supabase.co/functions/v1/send-push \
            -H "Content-Type: application/json" \
            -d "{\"action\": \"$ACTION\"}"
