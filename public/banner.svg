<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" fill="none">
  <defs>
    <!-- Dark Slate background gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="50%" stop-color="#0f0f13" />
      <stop offset="100%" stop-color="#14141a" />
    </linearGradient>

    <!-- Subtle radial glow behind emblem -->
    <radialGradient id="glow-purple" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-blue" cx="80%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Card glass gradient -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18181b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#121214" stop-opacity="0.95" />
    </linearGradient>

    <!-- Grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#27272a" stroke-width="0.75" stroke-opacity="0.4" />
    </pattern>

    <!-- Filter for soft drop shadow -->
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.65" />
    </filter>

    <!-- Emblem gradient -->
    <linearGradient id="emblem-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="20" fill="url(#bg-grad)" />
  <rect width="1200" height="420" rx="20" fill="url(#grid)" />
  <rect width="1200" height="420" rx="20" fill="url(#glow-purple)" />
  <rect width="1200" height="420" rx="20" fill="url(#glow-blue)" />

  <!-- Outer Border -->
  <rect x="0.5" y="0.5" width="1199" height="419" rx="19.5" fill="none" stroke="#27272a" stroke-width="1" stroke-opacity="0.8" />

  <!-- Center Content Container -->
  <g transform="translate(600, 210)" text-anchor="middle">
    <!-- Icon Container Pill -->
    <g transform="translate(0, -96)" filter="url(#card-shadow)">
      <rect x="-44" y="-44" width="88" height="88" rx="24" fill="url(#card-grad)" stroke="#3f3f46" stroke-width="1.2" />
      <!-- Stylized Calendar & Optimization Emblem -->
      <path d="M-18 -14 C-18 -20, -14 -24, -8 -24 L8 -24 C14 -24, 18 -20, 18 -14 L18 16 C18 22, 14 26, 8 26 L-8 26 C-14 26, -18 22, -18 16 Z" fill="none" stroke="url(#emblem-grad)" stroke-width="2.5" />
      <line x1="-18" y1="-10" x2="18" y2="-10" stroke="#71717a" stroke-width="2" />
      <!-- Header pins -->
      <line x1="-10" y1="-28" x2="-10" y2="-22" stroke="#e4e4e7" stroke-width="2.5" stroke-linecap="round" />
      <line x1="10" y1="-28" x2="10" y2="-22" stroke="#e4e4e7" stroke-width="2.5" stroke-linecap="round" />
      <!-- Calendar mini grid points -->
      <circle cx="-9" cy="-2" r="2.2" fill="#a855f7" />
      <circle cx="0" cy="-2" r="2.2" fill="#38bdf8" />
      <circle cx="9" cy="-2" r="2.2" fill="#34d399" />
      <circle cx="-9" cy="8" r="2.2" fill="#e4e4e7" opacity="0.6" />
      <circle cx="0" cy="8" r="2.2" fill="#e4e4e7" opacity="0.6" />
      <circle cx="9" cy="8" r="2.2" fill="#f43f5e" />
      <circle cx="-9" cy="17" r="2.2" fill="#e4e4e7" opacity="0.4" />
      <circle cx="0" cy="17" r="2.2" fill="#e4e4e7" opacity="0.4" />
      <circle cx="9" cy="17" r="2.2" fill="#38bdf8" />
    </g>

    <!-- Main Title -->
    <text y="0" font-family="-apple-system, BlinkMacSystemFont, 'Geist Sans', 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-1.2">
      Leave Planner <tspan fill="#a855f7">&amp;</tspan> Vault
    </text>

    <!-- Monospace Subtitle / Design Token Eyebrow -->
    <g transform="translate(0, 36)">
      <rect x="-185" y="-14" width="370" height="28" rx="14" fill="#18181b" stroke="#27272a" stroke-width="1" />
      <text y="5" font-family="'Geist Mono', ui-monospace, SFMono-Regular, monospace" font-size="12" font-weight="700" fill="#a1a1aa" letter-spacing="1.5">
        SLATE DESIGN SYSTEM · PRECISION PTO ENGINE
      </text>
    </g>

    <!-- Tagline Description -->
    <text y="92" font-family="-apple-system, BlinkMacSystemFont, 'Geist Sans', 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#71717a" letter-spacing="-0.2">
      Multi-day calendar optimizer, holiday bridge detection, and multi-device cloud sync with zero telemetry.
    </text>

    <!-- Mini Feature Metric Pills -->
    <g transform="translate(0, 142)">
      <!-- Pill 1 -->
      <g transform="translate(-240, 0)">
        <rect x="-70" y="-12" width="140" height="24" rx="6" fill="#121214" stroke="#27272a" stroke-width="1" />
        <text y="4" font-family="'Geist Mono', monospace" font-size="11" font-weight="600" fill="#e4e4e7">⚡ ZERO-WARP UI</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(-80, 0)">
        <rect x="-70" y="-12" width="140" height="24" rx="6" fill="#121214" stroke="#27272a" stroke-width="1" />
        <text y="4" font-family="'Geist Mono', monospace" font-size="11" font-weight="600" fill="#38bdf8">🔒 SUPABASE RLS</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(80, 0)">
        <rect x="-70" y="-12" width="140" height="24" rx="6" fill="#121214" stroke="#27272a" stroke-width="1" />
        <text y="4" font-family="'Geist Mono', monospace" font-size="11" font-weight="600" fill="#34d399">📱 OFFLINE PWA</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(240, 0)">
        <rect x="-70" y="-12" width="140" height="24" rx="6" fill="#121214" stroke="#27272a" stroke-width="1" />
        <text y="4" font-family="'Geist Mono', monospace" font-size="11" font-weight="600" fill="#c084fc">✨ MIT LICENSED</text>
      </g>
    </g>
  </g>
</svg>
